<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRISTIAN TORRES · LIQUID NEON — FULL STACK</title>
  <meta name="description" content="Portafolio líquido animado de Cristian Torres, Full Stack Developer." />
  <meta name="theme-color" content="#150A1E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Blobs líquidos animados -->
  <div class="blobs" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="noise"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">liquid<span class="brand-neon">/cristian</span></div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-view="home">INICIO</button>
        <button class="tab" data-view="stack">STACK</button>
        <button class="tab" data-view="projects">PROYECTOS</button>
        <button class="tab" data-view="experience">EXPERIENCIA</button>
        <button class="tab" data-view="contact">CONTACTO</button>
      </nav>
      <span id="clock" class="clock">00:00:00</span>
    </header>

    <main class="stage">
      <section class="panel active" data-view="home">
        <h1 class="big">CRISTIAN<br/>TORRES</h1>
        <div class="kicker">FULL STACK DEVELOPER · FLUIDO EN TODO</div>
        <p class="lede">10+ años moldeando <b>PHP</b>, <b>WordPress</b> y <b>React</b>. Aplicaciones web, plugins e integraciones <span class="neon">REST escalables</span>. IA estratégica incluida.</p>
        <div class="actions">
          <button class="btn" data-view="projects">SUMERGIRSE</button>
          <button class="btn ghost" data-view="contact">CONTACTO</button>
        </div>
        <div class="chips">
          <span>10+ años</span><span>40+ proyectos</span><span>Medellín, CO</span>
        </div>
      </section>

      <section class="panel" data-view="stack"><div id="stackGrid" class="stack-grid"></div></section>
      <section class="panel" data-view="projects"><div id="projGrid" class="proj-grid"></div></section>
      <section class="panel" data-view="experience"><div id="timeline" class="timeline"></div></section>
      <section class="panel" data-view="contact"><div id="contactGrid" class="contact-grid"></div></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
