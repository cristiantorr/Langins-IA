<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRISTIAN TORRES · ORBITAL INTERFACE — FULL STACK</title>
  <meta name="description" content="Portafolio orbital animado de Cristian Torres, Full Stack Developer." />
  <meta name="theme-color" content="#0A0F1E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-stars" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <span class="brand">ORBIT//CRISTIAN</span>
      <span class="status">ESTRELLA <i></i></span>
      <span id="clock" class="clock">00:00:00</span>
    </header>

    <!-- SISTEMA ORBITAL -->
    <div class="system">
      <!-- Anillos decorativos (rotan con anime.js) -->
      <div class="orbit-ring r1"></div>
      <div class="orbit-ring r2"></div>

      <!-- PLANETAS (navegación en órbita) -->
      <button class="planet p0 active"  data-view="home"><span>◎</span><i>INICIO</i></button>
      <button class="planet p1" data-view="stack"><span>◐</span><i>STACK</i></button>
      <button class="planet p2" data-view="projects"><span>◉</span><i>PROYECTOS</i></button>
      <button class="planet p3" data-view="experience"><span>◍</span><i>EXPERIENCIA</i></button>
      <button class="planet p4" data-view="contact"><span>◈</span><i>CONTACTO</i></button>

      <!-- NÚCLEO CENTRAL -->
      <div class="core">
        <section class="panel active" data-view="home">
          <h1 class="sun-name">CRISTIAN<br/>TORRES</h1>
          <div class="sun-role">FULL STACK DEV</div>
          <p class="sun-desc">10+ años orbitando entre PHP, WordPress y React. <span class="neb">APIs REST escalables</span> y código que brilla.</p>
          <div class="orbit-meta">
            <span>10+ AÑOS</span><span>40+ PROYECTOS</span><span>MEDELLÍN</span>
          </div>
        </section>

        <section class="panel" data-view="stack"><div id="stackGrid" class="stack-grid"></div></section>
        <section class="panel" data-view="projects"><div id="projGrid" class="proj-grid"></div></section>
        <section class="panel" data-view="experience"><div id="timeline" class="tline"></div></section>
        <section class="panel" data-view="contact"><div id="contactGrid" class="contact-grid"></div></section>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
